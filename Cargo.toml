[workspace]
resolver = "2"
members = ["crates/marshal", "crates/proto", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
marshal = { path = "crates/marshal" }
proto = { path = "crates/proto" }
anyhow = "1"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
