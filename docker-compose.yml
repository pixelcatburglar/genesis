# docker compose up --build
# Then point the build-1000 client's login screen at this host, port 26000.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://genesis:genesis@db:5432/genesis
      GENESIS_LISTEN: 0.0.0.0:26000
      GENESIS_AUTO_CREATE_ACCOUNTS: "1"
      RUST_LOG: info,genesis=debug
    ports:
      - "26000:26000"
    restart: unless-stopped

volumes:
  pgdata:
